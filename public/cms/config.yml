# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: marcusvetter/studio-green
  branch: main
  base_url: https://studio-green-cms-auth.marcus-vetter.workers.dev

media_folder: public/media
public_folder: /media

editor:
  preview: false

collections:
  - name: intro
    label: Intro
    folder: content/intro
    create: false
    delete: false
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Navigationstitel, name: nav_title, widget: string, required: false, hint: "Kürzerer Titel für die Navigation. Fällt auf den Titel zurück, wenn leer." }
      - { label: Section-Identifier, name: section, widget: hidden, default: intro }
      - { label: Reihenfolge, name: order, widget: hidden, default: 1 }
      - { label: Full-Bleed Bild, name: fullbleed_image, widget: image, required: false, hint: "Vollformat-Bild, das nach diesem Abschnitt angezeigt wird." }
      - { label: Bildunterschrift, name: fullbleed_caption, widget: string, required: false, hint: "Optionale Bildunterschrift für das Full-Bleed Bild." }
      - { label: Text, name: body, widget: markdown, hint: "Markdown-Text für den Intro-Abschnitt." }

  - name: projects
    label: Projekte
    folder: content/projects
    create: false
    delete: false
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Navigationstitel, name: nav_title, widget: string, required: false, hint: "Kürzerer Titel für die Navigation. Fällt auf den Titel zurück, wenn leer." }
      - { label: Section-Identifier, name: section, widget: hidden, default: projects }
      - { label: Reihenfolge, name: order, widget: hidden, default: 2 }
      - label: Projekte
        name: projects
        widget: list
        hint: "Jeder Eintrag ist ein Gartenprojekt."
        field:
          label: Projekt
          name: project
          widget: object
          fields:
            - { label: Nummer, name: nr, widget: string, hint: "Z. B. 001, 002, ..." }
            - { label: Name, name: name, widget: string }
            - { label: Beschreibung, name: description, widget: text }
            - { label: Bild, name: image, widget: image }
            - label: Tags
              name: tags
              widget: list
              required: false
              field:
                label: Tag
                name: tag
                widget: string

  - name: services
    label: Leistungen
    folder: content/services
    create: false
    delete: false
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Navigationstitel, name: nav_title, widget: string, required: false, hint: "Kürzerer Titel für die Navigation. Fällt auf den Titel zurück, wenn leer." }
      - { label: Section-Identifier, name: section, widget: hidden, default: services }
      - { label: Reihenfolge, name: order, widget: hidden, default: 3 }
      - { label: Full-Bleed Bild, name: fullbleed_image, widget: image, required: false, hint: "Vollformat-Bild, das nach diesem Abschnitt angezeigt wird." }
      - label: Leistungen
        name: cards
        widget: list
        hint: "Jeder Eintrag ist eine Leistungskategorie mit Schritten."
        field:
          label: Karte
          name: card
          widget: object
          fields:
            - { label: Nummer, name: nr, widget: string, hint: "Z. B. 01, 02, 03, ..." }
            - { label: Name, name: name, widget: string }
            - { label: Tagline, name: tagline, widget: string }
            - { label: Anmerkung, name: note, widget: string, required: false }
            - label: Schritte
              name: steps
              widget: list
              field:
                label: Schritt
                name: step
                widget: object
                fields:
                  - { label: Titel, name: title, widget: string }
                  - { label: Beschreibung, name: description, widget: text }

  - name: quote
    label: Zitat
    folder: content/quote
    create: false
    delete: false
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Navigationstitel, name: nav_title, widget: string, required: false, hint: "Kürzerer Titel für die Navigation. Fällt auf den Titel zurück, wenn leer." }
      - { label: Section-Identifier, name: section, widget: hidden, default: quote }
      - { label: Reihenfolge, name: order, widget: hidden, default: 4 }
      - { label: Zitattext, name: quote_text, widget: string }
      - { label: Autor, name: author, widget: string, required: false, hint: "Z. B. 'Verena Hoffmann · Studio Green'." }

  - name: about
    label: Über mich
    folder: content/about-me
    create: false
    delete: false
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Navigationstitel, name: nav_title, widget: string, required: false, hint: "Kürzerer Titel für die Navigation. Fällt auf den Titel zurück, wenn leer." }
      - { label: Section-Identifier, name: section, widget: hidden, default: about-me }
      - { label: Reihenfolge, name: order, widget: hidden, default: 5 }
      - { label: Bild, name: image, widget: image, required: false, hint: "Porträt für den Über-mich-Abschnitt." }
      - { label: Untertitel, name: subtitle, widget: string, required: false, hint: "Z. B. 'Biologin & Gartengestalterin · Andernach'." }
      - { label: Text, name: body, widget: markdown, hint: "Markdown-Text für den Über-mich-Abschnitt." }

  - name: contact
    label: Kontakt
    folder: content/contact
    create: false
    delete: false
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Section-Identifier, name: section, widget: hidden, default: contact }
      - { label: Reihenfolge, name: order, widget: hidden, default: 6 }
      - { label: Überschrift, name: headline, widget: string }
      - { label: Kontakttext, name: text, widget: text }
      - { label: E-Mail, name: email, widget: string, hint: "Z. B. 'hallo@studio-green.de'." }
